app = "ceibo-meteo"
primary_region = "cdg"

[build]

[env]
  NODE_ENV = "production"
  PORT = "4000"

[deploy]
  release_command = "npx prisma migrate deploy"

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 20
    hard_limit = 40

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1